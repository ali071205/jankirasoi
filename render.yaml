services:
  # ----------------------------------------------------------------------------
  # Janki Rasoi Authoritative Backend API (NestJS + Prisma + Fastify/Express)
  # Optimized for Render Free Tier (512 MB RAM, 0.1 vCPU, 15m idle sleep)
  # ----------------------------------------------------------------------------
  - type: web
    name: jankirasoi-api
    env: node
    plan: free
    region: oregon # or ohio / frankfurt / singapore
    autoDeploy: true
    buildCommand: pnpm install --frozen-lockfile && pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Critical: Restrict Node V8 heap to 384MB to prevent hard SIGKILL OOM on 512MB free tier
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      # Database connection string (PostgreSQL e.g. Neon, Supabase, or Render PostgreSQL)
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_SIZE
        value: "20"
      - key: DATABASE_POOL_TIMEOUT
        value: "30"
      # Cloudinary Storage Credentials (Required for food image uploads & auto-compression)
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Encryption Secrets (HMAC for OTPs & Session)
      - key: SESSION_SECRET
        sync: false
      - key: OTP_ENCRYPTION_SECRET
        sync: false
      # Production JWT signing secret (generate with: openssl rand -hex 32)
      - key: JWT_SECRET
        sync: false
      # Razorpay payment gateway credentials
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Frontend client URLs for CORS allowlisting
      - key: FRONTEND_URL
        sync: false
      - key: ADMIN_URL
        sync: false
      - key: ALLOW_SIMULATED_ROLE
        value: "true"
