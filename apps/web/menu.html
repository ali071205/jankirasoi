<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Daily Menu — Janki Rasoi</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1d5c34",
            "primary-container": "#38754a",
            "on-primary": "#ffffff",
            secondary: "#875200",
            "secondary-container": "#ffad45",
            surface: "#f8fbf0",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f5ea",
            "surface-container": "#ecefe4",
            "surface-container-high": "#e6e9df",
            "on-surface": "#191d16",
            "on-surface-variant": "#404941"
          },
          fontFamily: {
            headline: ["DM Sans", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body text-on-surface flex flex-col min-h-screen">
  <!-- Top Navigation Header -->
  <header class="fixed top-0 inset-x-0 z-50 bg-surface/95 backdrop-blur-xl shadow-xs">
    <div class="max-w-4xl mx-auto h-16 px-4 flex items-center justify-between gap-3">
      <a href="index.html" class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center font-bold">JR</span>
        <span class="font-headline font-bold text-lg text-on-surface">Janki Rasoi</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="cart.html" aria-label="Cart" class="relative w-10 h-10 flex items-center justify-center rounded-full bg-white shadow-sm hover:bg-gray-100 transition-colors">
          <span class="material-symbols-outlined text-[22px] text-on-surface">shopping_bag</span>
          <span id="cart-badge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 bg-secondary text-white text-[11px] rounded-full flex items-center justify-center font-bold">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 pt-20 pb-24 max-w-4xl mx-auto w-full px-4 flex flex-col gap-4">
    <!-- Notice Bar -->
    <div class="bg-secondary/10 rounded-xl p-3.5 flex items-center gap-2.5">
      <span class="material-symbols-outlined text-secondary text-[22px]">restaurant</span>
      <p class="text-xs sm:text-sm text-on-surface">
        <span class="font-bold text-secondary">Today's Fresh Batch:</span> Prepared in pure desi ghee and groundnut oil. Homestyle goodness delivered warm.
      </p>
    </div>

    <!-- Category Filter Ribbon -->
    <div class="sticky top-16 z-30 bg-surface/95 backdrop-blur-md py-2 overflow-x-auto no-scrollbar flex items-center gap-2" id="category-pills">
      <button class="px-4 py-1.5 rounded-full text-xs font-bold bg-primary text-white shadow-xs" onclick="filterCategory('all', this)">All Items</button>
    </div>

    <!-- Live Menu Items Container -->
    <div id="menu-container" class="flex flex-col gap-4">
      <div class="p-6 rounded-2xl bg-white shadow-xs animate-pulse h-40"></div>
      <div class="p-6 rounded-2xl bg-white shadow-xs animate-pulse h-40"></div>
    </div>
  </main>

  <!-- Sticky Bottom Cart Summary -->
  <div id="sticky-cart-bar" class="fixed bottom-0 inset-x-0 z-40 bg-white/95 backdrop-blur-md border-t border-gray-200 py-3 px-4 shadow-lg hidden">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      <div>
        <span class="text-xs text-on-surface-variant block"><span id="bar-item-count">0</span> Items in Tray</span>
        <span class="font-bold text-base text-primary">View Order & Checkout</span>
      </div>
      <a href="cart.html" class="px-6 py-2.5 rounded-full bg-primary text-white font-bold text-sm shadow-sm hover:bg-primary-container flex items-center gap-1.5">
        <span>Proceed</span>
        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
      </a>
    </div>
  </div>

  <script type="module">
    import { api, cart, showToast } from './js/api.js';

    let catalogData = null;
    let activeCategory = 'all';

    function updateCartUI() {
      const count = cart.count();
      const badge = document.getElementById('cart-badge');
      if (badge) badge.innerText = count;

      const bar = document.getElementById('sticky-cart-bar');
      const countEl = document.getElementById('bar-item-count');
      if (count > 0) {
        bar.classList.remove('hidden');
        if (countEl) countEl.innerText = count;
      } else {
        bar.classList.add('hidden');
      }
    }
    window.addEventListener('cart-updated', updateCartUI);

    async function loadCatalog() {
      try {
        catalogData = await api.getCatalog();
        renderCategoryPills();
        renderMenu();
        updateCartUI();
      } catch (err) {
        console.error('Failed to fetch menu:', err);
        document.getElementById('menu-container').innerHTML = `
          <div class="p-8 text-center text-red-600 bg-red-50 rounded-xl">
            <p class="font-bold">Could not connect to kitchen menu.</p>
            <p class="text-xs mt-1">${err.message}</p>
          </div>
        `;
      }
    }

    function renderCategoryPills() {
      const pillsContainer = document.getElementById('category-pills');
      if (!catalogData) return;
      pillsContainer.innerHTML = `
        <button class="px-4 py-1.5 rounded-full text-xs font-bold ${activeCategory === 'all' ? 'bg-primary text-white shadow-xs' : 'bg-white text-on-surface-variant border border-gray-200'}" onclick="window.filterCat('all')">
          All Dishes
        </button>
      ` + catalogData.categories.map(c => `
        <button class="px-4 py-1.5 rounded-full text-xs font-bold whitespace-nowrap ${activeCategory === c.id ? 'bg-primary text-white shadow-xs' : 'bg-white text-on-surface-variant border border-gray-200'}" onclick="window.filterCat('${c.id}')">
          ${c.name}
        </button>
      `).join('');
    }

    window.filterCat = (catId) => {
      activeCategory = catId;
      renderCategoryPills();
      renderMenu();
    };

    function renderMenu() {
      const container = document.getElementById('menu-container');
      if (!catalogData) return;

      const filteredCategories = activeCategory === 'all'
        ? catalogData.categories
        : catalogData.categories.filter(c => c.id === activeCategory);

      container.innerHTML = filteredCategories.map(cat => `
        <div class="flex flex-col gap-3">
          <h2 class="font-headline font-bold text-lg text-on-surface border-b border-gray-200 pb-1 mt-2">${cat.name}</h2>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            ${cat.items.map(item => `
              <div class="rounded-2xl bg-white shadow-xs border border-black/5 overflow-hidden flex flex-col justify-between">
                <div class="relative h-44 w-full bg-gray-100">
                  <img class="w-full h-full object-cover" src="${item.imageUrl || 'https://images.unsplash.com/photo-1546833999-b9f581a1996d?auto=format&fit=crop&w=600&q=80'}" alt="${item.name}"/>
                  <div class="absolute top-3 left-3 flex items-center gap-1">
                    <span class="w-4 h-4 bg-white rounded-xs flex items-center justify-center p-0.5 shadow-sm">
                      <span class="w-2.5 h-2.5 rounded-full bg-green-600"></span>
                    </span>
                    <span class="px-2 py-0.5 rounded-full bg-white/90 text-primary font-bold text-[10px] uppercase shadow-xs">Pure Veg</span>
                  </div>
                </div>
                <div class="p-4 flex flex-col justify-between flex-1 gap-3">
                  <div>
                    <div class="flex items-start justify-between gap-2">
                      <h3 class="font-headline font-bold text-base text-on-surface">${item.name}</h3>
                      <span class="font-headline font-bold text-base text-primary whitespace-nowrap">₹${(item.basePricePaise / 100).toFixed(2)}</span>
                    </div>
                    <p class="text-xs text-on-surface-variant mt-1 leading-relaxed">${item.description || ''}</p>
                  </div>

                  <!-- Portion Variant Selector if available -->
                  ${item.variants && item.variants.length > 1 ? `
                    <div class="flex flex-col gap-1 text-xs">
                      <span class="font-semibold text-gray-700">Portion:</span>
                      <select id="variant-${item.id}" class="border border-gray-200 rounded-lg p-1.5 text-xs bg-gray-50 font-medium">
                        ${item.variants.map(v => `
                          <option value="${v.id}" data-mod="${v.priceModifierPaise}">${v.name} ${v.priceModifierPaise > 0 ? `(+₹${(v.priceModifierPaise/100).toFixed(2)})` : ''}</option>
                        `).join('')}
                      </select>
                    </div>
                  ` : ''}

                  <button onclick="window.addItem('${item.id}', '${item.name.replace(/'/g, "\\'")}', ${item.basePricePaise}, '${item.imageUrl || ''}')" class="w-full h-10 rounded-full bg-primary text-white font-semibold text-xs flex items-center justify-center gap-1.5 shadow-xs hover:bg-primary-container active:scale-95 transition-all">
                    <span class="material-symbols-outlined text-[18px]">add_shopping_cart</span>
                    <span>Add to Tray</span>
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    window.addItem = (productId, name, pricePaise, imageUrl) => {
      const variantSelect = document.getElementById(`variant-${productId}`);
      let variantId = undefined;
      let variantName = undefined;
      let finalPrice = pricePaise;

      if (variantSelect) {
        variantId = variantSelect.value;
        const selectedOpt = variantSelect.options[variantSelect.selectedIndex];
        variantName = selectedOpt.text;
        const mod = parseInt(selectedOpt.dataset.mod || '0', 10);
        finalPrice += mod;
      }

      cart.add({
        productId,
        name,
        pricePaise: finalPrice,
        variantId,
        variantName,
        imageUrl,
        quantity: 1
      });

      showToast(`Added ${name} to your tray!`);
    };

    loadCatalog();
  </script>
</body>
</html>
