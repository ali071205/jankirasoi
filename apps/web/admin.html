<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <title>Kitchen KDS & Admin Console — Janki Rasoi</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1d5c34",
            "primary-container": "#38754a",
            "on-primary": "#ffffff",
            secondary: "#875200",
            "secondary-container": "#ffad45",
            surface: "#f8fbf0",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f5ea",
            "surface-container": "#ecefe4",
            "surface-container-high": "#e6e9df",
            "on-surface": "#191d16",
            "on-surface-variant": "#404941"
          },
          fontFamily: {
            headline: ["DM Sans", "sans-serif"],
            body: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body text-on-surface flex flex-col min-h-screen">
  <header class="fixed top-0 inset-x-0 z-50 bg-surface/95 backdrop-blur-xl shadow-xs border-b border-black/5">
    <div class="max-w-6xl mx-auto h-16 px-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="w-8 h-8 rounded-full bg-primary-container text-white flex items-center justify-center font-bold">JR</span>
        <div>
          <h1 class="font-headline font-bold text-base leading-tight">Janki Rasoi Kitchen Console</h1>
          <span class="text-[11px] text-primary font-bold flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-primary animate-ping"></span> Live Kitchen KDS
          </span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-xs font-semibold px-3 py-1.5 rounded-full bg-surface-container hover:bg-surface-container-high transition-colors">
          Customer Storefront
        </a>
      </div>
    </div>
  </header>

  <main class="flex-1 pt-20 pb-20 max-w-6xl mx-auto w-full px-4 flex flex-col gap-4">
    <!-- Shift KPI Bar -->
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
      <div class="p-4 rounded-xl bg-white shadow-xs border border-black/5">
        <span class="text-xs text-on-surface-variant font-medium">Active Orders</span>
        <span id="kpi-active-count" class="font-headline font-bold text-2xl text-primary block mt-1">0</span>
      </div>
      <div class="p-4 rounded-xl bg-white shadow-xs border border-black/5">
        <span class="text-xs text-on-surface-variant font-medium">Shift Revenue</span>
        <span id="kpi-revenue" class="font-headline font-bold text-2xl text-on-surface block mt-1">₹0.00</span>
      </div>
      <div class="p-4 rounded-xl bg-white shadow-xs border border-black/5">
        <span class="text-xs text-on-surface-variant font-medium">Lunch Service</span>
        <span class="font-headline font-bold text-sm text-green-700 block mt-2">OPEN • 12:30–13:30</span>
      </div>
      <div class="p-4 rounded-xl bg-white shadow-xs border border-black/5">
        <span class="text-xs text-on-surface-variant font-medium">Dinner Service</span>
        <span class="font-headline font-bold text-sm text-amber-700 block mt-2">OPEN • 19:30–20:30</span>
      </div>
    </div>

    <!-- Live Orders Kanban / Board -->
    <div class="bg-white rounded-2xl p-5 shadow-xs border border-black/5 flex flex-col gap-4">
      <div class="flex items-center justify-between border-b border-gray-100 pb-3 flex-wrap gap-2">
        <div class="flex items-center gap-2">
          <span class="material-symbols-outlined text-primary text-[24px]">kitchen</span>
          <h2 class="font-headline font-bold text-lg text-on-surface">Kitchen Orders Queue</h2>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="window.loadAdminOrders()" class="px-3 py-1 rounded-full bg-surface-container hover:bg-surface-container-high text-xs font-semibold flex items-center gap-1">
            <span class="material-symbols-outlined text-[14px]">refresh</span> Refresh
          </button>
        </div>
      </div>

      <!-- Orders Container -->
      <div id="admin-orders-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <!-- Live orders rendered by JavaScript -->
        <div class="p-6 rounded-xl bg-gray-50 border border-gray-200 animate-pulse h-48"></div>
        <div class="p-6 rounded-xl bg-gray-50 border border-gray-200 animate-pulse h-48"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { api, showToast } from './js/api.js';

    window.loadAdminOrders = async () => {
      const container = document.getElementById('admin-orders-container');
      try {
        const data = await api.getAdminOrders();
        const orders = data.orders || [];

        // Update KPIs
        const activeOrders = orders.filter(o => o.status !== 'DELIVERED' && o.status !== 'CANCELLED');
        document.getElementById('kpi-active-count').innerText = activeOrders.length;

        const totalRev = orders.reduce((sum, o) => sum + (o.totalAmountPaise || 0), 0);
        document.getElementById('kpi-revenue').innerText = `₹${(totalRev / 100).toFixed(2)}`;

        if (orders.length === 0) {
          container.innerHTML = `
            <div class="col-span-full p-12 text-center text-gray-500 bg-gray-50 rounded-xl">
              <span class="material-symbols-outlined text-[36px] text-gray-300 block mb-2">soup_kitchen</span>
              <p class="font-bold text-sm">No live orders in kitchen queue right now.</p>
              <p class="text-xs text-gray-400 mt-1">Place an order from the customer storefront to see it update live.</p>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => {
          const addr = typeof o.deliveryAddress === 'object' ? `${o.deliveryAddress.flat || ''}, ${o.deliveryAddress.street || ''}` : o.deliveryAddress;
          return `
            <div class="p-4 rounded-xl border border-gray-200 bg-surface-container-lowest shadow-xs flex flex-col justify-between gap-3">
              <div>
                <div class="flex items-start justify-between gap-2">
                  <div>
                    <span class="text-xs font-bold text-primary">${o.orderNumber}</span>
                    <span class="text-[10px] text-gray-400 block">${new Date(o.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                  </div>
                  <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${getStatusBadgeClass(o.status)}">
                    ${o.status.replace(/_/g, ' ')}
                  </span>
                </div>

                <div class="mt-3 text-xs flex flex-col gap-1">
                  <div class="font-bold text-on-surface">${o.customerName} • <span class="text-primary">${o.customerPhone}</span></div>
                  <div class="text-gray-500 text-[11px] line-clamp-1">${addr || 'Address on record'}</div>
                  <div class="text-[11px] text-secondary font-semibold mt-1">Slot: ${o.slotLabel}</div>
                </div>
              </div>

              <div class="pt-2 border-t border-gray-100 flex items-center justify-between text-xs">
                <div>
                  <span class="text-gray-500 block text-[10px]">Total</span>
                  <span class="font-bold text-sm text-primary">₹${(o.totalAmountPaise / 100).toFixed(2)}</span>
                </div>
                <div class="flex items-center gap-1.5">
                  ${renderActionButton(o)}
                </div>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error('Failed to load admin orders:', err);
      }
    };

    function getStatusBadgeClass(status) {
      switch (status) {
        case 'PLACED': return 'bg-blue-100 text-blue-800';
        case 'ACCEPTED': return 'bg-amber-100 text-amber-800';
        case 'PREPARING': return 'bg-orange-100 text-orange-800';
        case 'READY_FOR_PICKUP': return 'bg-purple-100 text-purple-800';
        case 'OUT_FOR_DELIVERY': return 'bg-teal-100 text-teal-800';
        case 'DELIVERED': return 'bg-green-100 text-green-800';
        default: return 'bg-gray-100 text-gray-800';
      }
    }

    function renderActionButton(order) {
      switch (order.status) {
        case 'PLACED':
          return `<button onclick="window.updateStatus('${order.id}', 'ACCEPTED')" class="px-3 py-1 bg-primary text-white text-xs font-semibold rounded-lg hover:bg-primary-container">Accept</button>`;
        case 'ACCEPTED':
          return `<button onclick="window.updateStatus('${order.id}', 'PREPARING')" class="px-3 py-1 bg-orange-600 text-white text-xs font-semibold rounded-lg hover:bg-orange-700">Start Cooking</button>`;
        case 'PREPARING':
          return `<button onclick="window.updateStatus('${order.id}', 'READY_FOR_PICKUP')" class="px-3 py-1 bg-purple-600 text-white text-xs font-semibold rounded-lg hover:bg-purple-700">Pack & Ready</button>`;
        case 'READY_FOR_PICKUP':
          return `<button onclick="window.updateStatus('${order.id}', 'OUT_FOR_DELIVERY')" class="px-3 py-1 bg-teal-700 text-white text-xs font-semibold rounded-lg hover:bg-teal-800">Dispatch Rider</button>`;
        case 'OUT_FOR_DELIVERY':
          return `<button onclick="window.manualOverride('${order.id}')" class="px-2.5 py-1 bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg hover:bg-gray-300">Override</button>`;
        case 'DELIVERED':
          return `<span class="text-green-700 font-bold text-xs flex items-center gap-0.5"><span class="material-symbols-outlined text-[14px]">done_all</span> Delivered</span>`;
        default:
          return '';
      }
    }

    window.updateStatus = async (orderId, newStatus) => {
      try {
        await api.updateOrderStatus(orderId, newStatus, 'Kitchen KDS action');
        showToast(`Order updated to ${newStatus}`);
        await window.loadAdminOrders();
      } catch (err) {
        showToast(err.message, true);
      }
    };

    window.manualOverride = async (orderId) => {
      const reason = prompt('Enter manual verification reason (e.g. Phone confirmation with customer):');
      if (!reason) return;
      try {
        await api.overrideDelivery(orderId, reason);
        showToast('Order manually marked DELIVERED');
        await window.loadAdminOrders();
      } catch (err) {
        showToast(err.message, true);
      }
    };

    window.loadAdminOrders();
    // Auto refresh every 6 seconds
    setInterval(window.loadAdminOrders, 6000);
  </script>
</body>
</html>
